[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-investigator"
version = "0.1.0"
description = "A local, tool-using warehouse incident investigator powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Warehouse Investigator"}]
dependencies = ["chromadb"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
investigate = "warehouse_investigator.cli:main"
evaluate = "warehouse_investigator.evaluate:main"
feedback = "warehouse_investigator.feedback_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
warehouse_investigator = ["data/warehouse/*.json", "data/evaluation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
